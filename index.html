<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Home</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  /* 本物のスクロールを完全に止める */
  overflow: hidden;
  overscroll-behavior: none;

  background: #000;
}

/* サイト全体 */
#app {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  touch-action: none;

  background: #000;
}

/*
  YouTubeホーム画面の画像

  youtube-home.png を
  index.html と同じ場所に置く
*/
#home-image {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  user-select: none;
  -webkit-user-drag: none;

  pointer-events: none;
}

/*
  上側のグルグル表示エリア

  普段は透明。
*/
#refresh-area {
  position: absolute;

  top: 0;
  left: 0;

  width: 100%;
  height: 100px;

  display: flex;
  justify-content: center;
  align-items: center;

  pointer-events: none;
}

/* グルグル */
#spinner {
  width: 30px;
  height: 30px;

  border: 3px solid rgba(255,255,255,0.35);
  border-top-color: white;

  border-radius: 50%;

  opacity: 0;

  transform: scale(0.7);

  transition:
    opacity 0.15s ease,
    transform 0.15s ease;
}

/* 表示中 */
#spinner.show {
  opacity: 1;
  transform: scale(1);

  animation: spin 0.75s linear infinite;
}

@keyframes spin {

  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(360deg);
  }

}
</style>
</head>

<body>

<div id="app">

  <!-- YouTubeホーム画面のスクショ -->
  <img
    id="home-image"
    src="youtube-home.png"
    alt=""
    draggable="false"
  >

  <!-- 上のグルグル -->
  <div id="refresh-area">
    <div id="spinner"></div>
  </div>

</div>


<script>

/* =========================
   スワイプ処理
========================= */

const app = document.getElementById("app");
const spinner = document.getElementById("spinner");

let startY = 0;
let currentY = 0;

let swiping = false;
let loading = false;


/* 指を画面につけた */
app.addEventListener("touchstart", function(e) {

  if (e.touches.length !== 1) return;

  startY = e.touches[0].clientY;
  currentY = startY;

  swiping = true;

}, { passive: false });


/* 指を動かしている */
app.addEventListener("touchmove", function(e) {

  if (!swiping) return;

  currentY = e.touches[0].clientY;

  /*
    ここが重要。

    実際のページを
    下方向へスクロールさせない。
  */
  e.preventDefault();

}, { passive: false });


/* 指を離した */
app.addEventListener("touchend", function(e) {

  if (!swiping) return;

  swiping = false;

  const distance = currentY - startY;


  /*
    上 → 下へ
    60px以上スワイプしたら
    更新っぽい動作
  */
  if (distance >= 60 && !loading) {

    refreshAnimation();

  }

}, { passive: false });


/* =========================
   更新アニメーション
========================= */

function refreshAnimation() {

  loading = true;

  /* グルグルを表示 */
  spinner.classList.add("show");


  /*
    少し待つ
  */
  setTimeout(function() {

    /* グルグルを消す */
    spinner.classList.remove("show");


    /*
      ★重要★

      画像を変更しない。

      新しい動画も読み込まない。

      つまり何回やっても
      同じホーム画面のまま。
    */

    loading = false;

  }, 900);

}


/* =========================
   iPhoneのスクロール防止
========================= */

document.addEventListener("touchmove", function(e) {

  e.preventDefault();

}, { passive: false });


/*
  ブラウザの
  pull-to-refresh対策
*/
document.body.addEventListener("touchstart", function(e) {

  if (e.touches[0].clientY <= 5) {
    e.preventDefault();
  }

}, { passive: false });

</script>

</body>
</html>
