<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0">

  <title>スワイプ体験</title>

  <style>

    * {

      box-sizing: border-box;

    }

    html,

    body {

      margin: 0;

      padding: 0;

      width: 100%;

      background: #fff;

      /* 下にスクロールできる */

      overflow-x: hidden;

      overflow-y: auto;

      font-family: Arial, sans-serif;

    }

    /* ページ全体 */

    #app {

      position: relative;

      width: 100%;

      background: #fff;

    }

    /* スクショ */

    #screen {

      display: block;

      width: 100%;

      height: auto;

      user-select: none;

      -webkit-user-drag: none;

    }

    /* くるくる */

    #loading {

      position: fixed;

      top: 50%;

      left: 50%;

      transform: translate(-50%, -50%);

      width: 50px;

      height: 50px;

      display: flex;

      justify-content: center;

      align-items: center;

      opacity: 0;

      pointer-events: none;

      z-index: 1000;

    }

    #loading.show {

      opacity: 1;

    }

    /* くるくる本体 */

    .spinner {

      width: 45px;

      height: 45px;

      border: 5px solid #ddd;

      border-top-color: #777;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

    }

    @keyframes spin {

      from {

        transform: rotate(0deg);

      }

      to {

        transform: rotate(360deg);

      }

    }

  </style>

</head>

<body>

  <main id="app">

    <!-- スクショ -->

    <img

      id="screen"

      src="screen.jpg"

      alt=""

    >

    <!-- くるくる -->

    <div id="loading">

      <div class="spinner"></div>

    </div>

  </main>

  <script>

    const loading =

      document.getElementById("loading");

    let startY = 0;

    let busy = false;

    /*

      スワイプ開始

    */

    document.addEventListener(

      "touchstart",

      function(event) {

        startY =

          event.touches[0].clientY;

      },

      { passive: true }

    );

    /*

      スワイプ終了

    */

    document.addEventListener(

      "touchend",

      function(event) {

        if (busy) return;

        const endY =

          event.changedTouches[0].clientY;

        const distance =

          startY - endY;

        /*

          上に70px以上

          スワイプしたら

          くるくる

        */

        if (distance > 70) {

          showLoading();

        }

      },

      { passive: true }

    );

    /*

      くるくる表示

    */

    function showLoading() {

      busy = true;

      loading.classList.add("show");

      /*

        1秒後に消す

      */

      setTimeout(function() {

        loading.classList.remove("show");

        busy = false;

      }, 1000);

    }

  </script>

</body>

</html>
